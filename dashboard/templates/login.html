<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTOSIRA — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#0b0e1a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.box{background:#131728;border:1px solid #1e2235;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;}
.logo{font-size:28px;font-weight:700;color:#00d4ff;letter-spacing:3px;text-align:center;margin-bottom:6px;}
.sub{font-size:11px;color:#444;text-align:center;letter-spacing:1px;margin-bottom:32px;}
.lbl{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;display:block;}
input{width:100%;background:#0b0e1a;border:1px solid #1e2235;border-radius:8px;padding:12px 14px;color:#fff;font-size:14px;margin-bottom:16px;outline:none;transition:border .2s;font-family:Arial,sans-serif;}
input:focus{border-color:#00d4ff;}
.btn{width:100%;background:#001a11;border:1px solid #004433;border-radius:8px;padding:13px;color:#00ff88;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all .15s;font-family:Arial,sans-serif;}
.btn:hover{background:#002a1a;}
.error{background:#1a0000;border:1px solid #440000;border-radius:8px;padding:10px 14px;color:#ff4444;font-size:12px;margin-bottom:16px;text-align:center;}
.dot-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:24px;}
.dot{width:6px;height:6px;border-radius:50%;background:#00ff88;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.15}}
.dot-txt{font-size:10px;color:#333;letter-spacing:1px;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">MOTOSIRA</div>
  <div class="sub">Motorcycle Sound Intelligent Recognition Assistant</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <label class="lbl">Username</label>
    <input type="text" name="username" placeholder="Enter username" autocomplete="off" required>
    <label class="lbl">Password</label>
    <input type="password" name="password" placeholder="Enter password" required>
    <button class="btn" type="submit">Login</button>
  </form>
  <div class="dot-row">
    <div class="dot"></div>
    <div class="dot-txt">SECURE ACCESS ONLY</div>
  </div>
</div>
</body>
</html>
